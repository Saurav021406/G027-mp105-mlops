# MP105 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G027"          # your group id, e.g. "G042"
problem_id: "MP105"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: weight_kg      # the column recorded in a different unit
    group_value: Metro     # the value of destination whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 38              # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: declared_value_rs
    start_date: "2026-05-10"  # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-05-27"    # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 14              # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: service
    true_levels: 3

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    distance_km: null
    weight_kg: null
    hub_backlog: null
    pin_code_tier: null
    declared_value_rs: null
    transfers: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of destination
    'Metro': null
    'Tier-2': null
    'Rural': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
